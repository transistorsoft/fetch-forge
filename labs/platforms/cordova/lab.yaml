# Cordova platform manifest — fetch lab (WO-002).  Modelled on bg-forge's labs/platforms/cordova (addc50501): a Cordova
# project generated by build.sh from app/ (config.xml, package.json with cordova-android pinned exactly and locked), the
# plugin under test staged and re-added every build, the lab's own plugin (app/lab-plugin) and native sources
# (app/native) and the driver (app/www) put in by hand, and ./gradlew building.  The template's android:configChanges is
# untouched: it omits fontScale and fontWeightAdjustment, so bold and fontscale recreate the Activity (build.sh asserts).
#
# (WO-002, 2026-11-15) Android, and on the Simulator iOS on Swift Package Manager only (Chris: cordova-ios 8 builds this
# plugin from its Package.swift alone, and cordova-ios 7 crashes on Xcode 27).  Chris's order: Capacitor Android, then
# Capacitor iOS, then Flutter, then Cordova.
name: cordova
# Its column on a board, and its place in a sweep's queue and build pass (bg-forge's Cordova column).
column: 4
short: cdv                        # its name in a board's eight-character column (labkit.board_name)
# Distinct from bg-forge's com.transistorsoft.labs.* (WO-002 "Distinct package ids"): the two labs share the Lab
# devices and their claims, and each lab's first step evicts every other lab app by prefix (bg-forge WO-191).  It is
# also config.xml's widget id, which cordova makes the Android package.
package: com.transistorsoft.fetchlab.cordova
activity: .MainActivity

# No `web:` block: build.sh copies the driver itself, after the bootstrap's prepare (which would overwrite it), into a
# platform it may first regenerate — a copy run.py made before the build would be deleted or overwritten either way.
build:
  cwd: platforms/cordova
  cmd: ["./build.sh", "{native}", "{plugin}"]
  apk: platforms/cordova/app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

plugins:
  worktree: default          # the checkout default_checkout names (build.sh stages a copy of it)

# The checkout `default` builds.  run.py hashes its HEAD and working tree into the source stamp, so a plugin
# commit invalidates the installed app instead of passing for it.
default_checkout: "{repo}/cordova/background-fetch"

# (WO-002, iOS) The Simulator host: a Cordova project of its own, generated by build.sh at app/build/ios-spm from
# config.xml and cordova-ios 8.1.1, with app/native-ios/AppDelegate.swift over its AppDelegate and the lab plugin's iOS
# half (app/lab-plugin/src/apple).
ios:
  package: com.transistorsoft.fetchlab.cordova
  build:
    cwd: platforms/cordova
    cmd: ["./build.sh", "{native}", "{plugin}"]
    # One artifact (bg-forge WO-192 D2): build.sh copies the app it proved here.
    app: platforms/cordova/app/build/lab-ios/FetchCordovaLab.app
    # SwiftPM only.  A variant with no `channel:` (FIX) is every host's default build, and this host's one build is
    # SwiftPM: FIX and FIX-SPM build the same app (so on FIX's board, cdv's iOS column is a SwiftPM column).
    channels: [spm]
    env:
      LAB_OS: ios
      LAB_BUNDLE: com.transistorsoft.fetchlab.cordova
      LAB_XCFRAMEWORKS: "{labs}/xcframeworks"       # labs/harness/publish_native_fetch_ios.sh writes it
  supports:
    triggers: [none]
    calls: []

supports:
  # The template's android:configChanges omits fontScale and fontWeightAdjustment, so bold and fontscale recreate the
  # Activity; `finish` is the second `am start --ez finishNow true`.
  triggers: [bold, fontscale, finish, none]
  calls: []                  # no legacy tick-counted `call` hooks: fetch scenarios use `api` hooks

notes:
  - "(WO-002) Launch extras honoured, as the other hosts': configB64/hooksB64/eventsB64/scenario/nativeLabel/view/stopOnTerminate/finishNow, and the fetch knobs noConfigure (bool), finishDelayMs (int, default 1000), withholdFinish (bool), finishOnTimeout (bool, default true), restartOnFinish (bool, WO-007: finishNow then restarts the app — finish(), then startActivity() of a copy of the launch intent; restart-foreground-android).  Read whatever type `am start` sent them as.  MainActivity never calls setIntent(): Lab.args() reads the launch the Activity was started with.  The boot line's args= lists what was honoured."
  - "(WO-002) The three finish knobs are also written to SharedPreferences `lab-knobs` by MainActivity.onCreate (commit, not apply), because the headless task has no launch intent: it reads the LAST launch's knobs."
  - "(WO-002) The driver reaches the host through the lab's own Cordova plugin, app/lab-plugin (window.Lab: args, knobs, probe, verdict, log).  Every driver line goes through Lab.log, which the host logs VERBATIM under the tag LAB (no reply: lab.js passes no callbacks): Cordova 15 does not intercept the WebView console, whose own format would cut a line's last field."
  - "(WO-002) configB64 is FLAT (BackgroundFetchConfig has no groups) and is merged over the driver's defaults {minimumFetchInterval: 15, stopOnTerminate: <the extra>, startOnBoot: false, enableHeadless: true} before the boot configure(). The driver echoes `LAB app=config json={…}` before every configure() it makes."
  - "(WO-002) A recreation or a restart builds a new Activity, a new WebView and new plugin instances, so the page reloads: like Capacitor (and unlike React Native), the driver calls configure() on EVERY boot.  The first api batch, the anchor line and the slots run on boot 1 only (labkit expects that of a page-reload host).  The plugin under test is onload on both OSes: created with the page, before its Activity's first onResume (Android since WO-010; until then it was created on its first exec(), after that resume)."
  - "(WO-002) Until WO-009 the plugin's JS was CALLBACK style but for configure(): start, stop, status and scheduleTask returned nothing where the types declare Promises, and api-smoke read them red (a finding, Chris 2026-11-15, as Capacitor's void returns were, WO-006; the scenarios that use status() as an anchor assert `outcome: resolved`).  (WO-009) They now return Promises settled by the native reply, and still call the callbacks; finish stays void, as the types declare.  `api` hooks run against the published surface (window.BackgroundFetch, as a customer calls it).  The driver's own calls use the callbacks: its tick reads status() through one, and its finish after a delivery waits for finish's success or failure (`outcome=ok|rejected`)."
  - "(WO-002) Headless is Java-only on Cordova (no JavaScript runs headless).  CDVBackgroundFetch hands the SDK the FIXED class name com.transistorsoft.cordova.backgroundfetch.BackgroundFetchHeadlessTask (its HEADLESS_JOB_SERVICE_CLASS), whatever the app's package; the plugin installs none, so a customer adds theirs and build.sh copies the lab's (app/native).  The SDK reflects it as `new BackgroundFetchHeadlessTask().onFetch(context, task)`.  It logs `LAB point=headless event=fetch|timeout taskId=<id> timeout=<bool>`, then `LAB point=task-probe <probe>`, then finishes per the persisted knobs: `LAB point=task-api api=finish args=<taskId> outcome=ok|withheld|threw after_ms=<ms>`.  Nothing it logs starts with `point=headless-`."
  - "(WO-002) The probe (`Lab.probe()`, every tick and at onCreate/resume/onDestroy, and `point=appCreate` in LabApplication.onCreate in every process; build.sh names LabApplication in the generated manifest) is the Capacitor host's: reflective, never building an SDK singleton — LifecycleManager's and BackgroundFetch's own static instances read BY TYPE (`headless=`, `background=`, `adapter=`), and the SDK's persisted task ids from SharedPreferences TSBackgroundFetch `tasks`."
  - "(WO-002) Native pin: the plugin hard-codes `tsbackgroundfetch:4.1.+` with no ext variable (src/android/build.gradle), so app/lab-native.gradle — applied from the generated root build.gradle — makes labs/m2 the only repository for the module (exclusiveContent) and forces the label over whatever is requested; build.sh refuses an APK whose resolved version is not the label or whose AAR is not byte-identical to labs/m2's."
  - "(WO-002) The plugin is STAGED, not linked: build.sh copies the checkout's working-tree files (minus example/) into .stage/cordova-background-fetch (gitignored), records the checkout, HEAD, dirty flag and a content hash in .lab-source, and `cordova plugin add`s the stage --nosave (npm 11 links a directory dependency: adding the checkout would let npm and cordova write into the submodule).  build.sh proves the installed CDVBackgroundFetch.java is the stage's, and that the APK's plugin JS carries the stage's www/index.js whole."
  - "(WO-002, iOS) SwiftPM only (Chris, 2026-11-15): on cordova-ios 8 the plugin builds from its Package.swift alone (plugin.xml `<platform name=\"ios\" package=\"swift\">`, its pod nospm), and cordova-ios 7 crashes on Xcode 27.  The host is a Cordova project of its OWN, app/build/ios-spm (gitignored, skipped by run.py's stamp), not a second platform in app/: `cordova plugin add/rm` act on every installed platform.  It sits under app/ so cordova-fetch takes the cordova-ios 8.1.1 `npm ci` installed into app/node_modules; its platforms/ is made first (cordova takes the first ancestor with www + config.xml + platforms/ for the root), and it is regenerated with rm -rf, never `platform rm`, when its .lab-host changes (cordova-ios, the CLI, config.xml)."
  - "(WO-002, iOS) cordova-ios 8 still requires CocoaPods >= 1.16 and runs `pod install` on every plugin add and rm, even for a SwiftPM plugin (its <podspec> carries a <source>): the customer's path, kept; build.sh proves the Podfile names no pod and Podfile.lock no TSBackgroundFetch.  config.xml's iOS block carries the `deployment-target 15.0` preference (it lifts the CordovaPlugins package to the plugin's iOS 15) and the lab's custom task id (BGTaskSchedulerPermittedIdentifiers), the route the plugin's README gives customers."
  - "(WO-002, iOS) Pins and proofs: the plugin's own `transistor-background-fetch from: 4.2.0` resolves through the per-label SwiftPM mirror (mirrors.json in both containers; the build is cordova's own `-workspace App.xcworkspace -scheme App`, whose Package.resolved must pin the mirror's commit, and no fetch from GitHub).  build.sh proves the installed package is the stage's (its Package.swift but for cordova-ios's one rewrite), the CordovaPlugins package names it at iOS 15, the lab plugin's LabPlugin.m is in the App target, and from the artifact: the slice's sha256 and version, one carrier of the SDK's version string (FetchCordovaLab.debug.dylib), the SDK's, the plugin's and LabPlugin's classes, the plugin's CDVAppDelegate category, the driver and the plugin JS, and copies the app (built at the template's DSTROOT, platforms/ios/build) to app/build/lab-ios."
  - "(WO-002, iOS) app/native-ios/AppDelegate.swift is the template's `@objc @implementation` AppDelegate plus the launch lines (didFinishLaunching first, --sdkLaunchCall=delegate|scene|none, sceneWillConnect) and a wrapper around the legacy fetch whose `super` IS the plugin's category on CDVAppDelegate: the plugin forwards the fetch, as in a customer's app.  The lab plugin's iOS half (app/lab-plugin/src/apple/LabPlugin.m, never under a directory named `ios`: run.py's stamp skips them) is onload (`point=pluginLoad n=`, the Darwin custom-task hook) and logs each driver line as `LAB <line>` (os_log has no tag; without the prefix no driver line reached a capture, MEASURED), with no reply (null callbacks: an INVALID callbackId).  It references TSBackgroundFetchVersionString, which links the SDK's version string in."
  - "(WO-002, iOS, MEASURED 2026-11-15) The driver pauses its periodic native calls while hidden on iOS (PAUSE_HIDDEN, the Capacitor page's rule): bgSilenceMs 5933-6312 in ios-fetch-sim `background` and ios-timeout-sim, both variants.  Cordova iOS read 5/7 on FIX and FIX-SPM (which build the same app), api-smoke-ios and ios-stop-start red on the callback-style finding, until WO-009's fix: 7/7 on both with it (2026-11-16)."
  - "(WO-002) The generated project (app/platforms/android) is regenerated when its inputs change (platforms/android/.lab-host: the cordova-android the committed lock installed, the global cordova CLI, config.xml); run.py's source stamp hashes none of app/platforms.  KNOWN GAP: the global cordova CLI (13.0.0) is in the .lab-host but not in run.py's stamp, so a CLI upgrade alone leaves `--build stale` reusing the APK; sweep with `--build all` after one."
