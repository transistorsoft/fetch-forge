# Project-wide Gradle settings (the RN 0.88.0 template's, as bg-forge's RN lab carries them).

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

android.useAndroidX=true

# (WO-002) The Lab AVDs are arm64-v8a; x86_64 keeps an Intel host's emulator possible.  The template's
# four ABIs only made the APK and the C++ build twice as large.
reactNativeArchitectures=arm64-v8a,x86_64

newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
# Starting from AGP 10.x these opt outs will be removed.
android.builtInKotlin=false
android.newDsl=false
