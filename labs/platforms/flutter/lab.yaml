# Flutter platform manifest — fetch lab (WO-002).  Modelled on bg-forge's labs/platforms/flutter (bg-forge addc50501):
# a stock Flutter 3.47.5 Android project (flutter create's template, Gradle KTS) reduced to a scenario driver, here
# driving the background_fetch Dart plugin.  The template's android:configChanges are untouched: they list fontScale
# but not fontWeightAdjustment, so only `bold` recreates the Activity (`fontscale` does not).
#
# (WO-002) Android (2026-11-13) and, on the Simulator, iOS on both channels (pods, spm; 2026-11-14).  Chris's order:
# Capacitor Android, then Capacitor iOS, then Flutter, then Cordova.
name: flutter
# Its column on a board, and its place in a sweep's queue and build pass (bg-forge's Flutter column).
column: 1
short: flt                        # its name in a board's eight-character column (labkit.board_name)
# Distinct from bg-forge's com.transistorsoft.labs.* (WO-002 "Distinct package ids"): the two labs share the Lab
# devices and their claims, and each lab's first step evicts every other lab app by prefix (bg-forge WO-191).
package: com.transistorsoft.fetchlab.flutter
activity: .MainActivity

build:
  cwd: platforms/flutter
  cmd: ["./build.sh", "{native}", "{plugin}"]
  apk: platforms/flutter/app/build/app/outputs/flutter-apk/app-debug.apk

plugins:
  worktree: default          # the checkout default_checkout names (build.sh stages a copy of it)

# The checkout `default` builds.  run.py hashes its HEAD and working tree into the source stamp, so a plugin
# commit invalidates the installed app instead of passing for it.
default_checkout: "{repo}/flutter/background_fetch"

# (WO-002, iOS) The Simulator host: Flutter 3.47.5's iOS template, generated by build.sh into a Flutter project of its
# own per channel (app/build/ios-pods, app/build/ios-spm), with app/native-ios/AppDelegate.swift over its AppDelegate.
ios:
  package: com.transistorsoft.fetchlab.flutter
  build:
    cwd: platforms/flutter
    cmd: ["./build.sh", "{native}", "{plugin}"]
    # One artifact whichever channel built it (bg-forge WO-192 D2): build.sh copies the app it proved here.
    app: platforms/flutter/app/build/lab-ios/Runner.app
    # How the app gets TSBackgroundFetch: a variant's `channel:` picks one (LAB_CHANNEL); none is pods.
    channels: [pods, spm]
    env:
      LAB_OS: ios
      LAB_BUNDLE: com.transistorsoft.fetchlab.flutter
      LAB_XCFRAMEWORKS: "{labs}/xcframeworks"       # labs/harness/publish_native_fetch_ios.sh writes it
  supports:
    triggers: [none]
    calls: []

supports:
  # The template's android:configChanges lists fontScale (so `fontscale` recreates nothing) but not
  # fontWeightAdjustment (so `bold` does); `finish` is the second `am start --ez finishNow true`.
  triggers: [bold, finish, none]
  calls: []                  # no legacy tick-counted `call` hooks: fetch scenarios use `api` hooks

notes:
  - "(WO-002) Launch extras honoured, as React Native's and Capacitor's: configB64/hooksB64/eventsB64/scenario/nativeLabel/view/stopOnTerminate/finishNow, and the fetch knobs noConfigure (bool), finishDelayMs (int, default 1000), withholdFinish (bool), finishOnTimeout (bool, default true), restartOnFinish (bool, WO-007: finishNow then restarts the app — finish(), then startActivity() of a copy of the launch intent; restart-foreground-android). MainActivity keeps the launch intent and the driver reads it over the lab's own channel (`lab/probe` args), whatever type `am start` sent each extra as (--ez/--ei/--es). The boot line's args= lists what was honoured."
  - "(WO-002) The three finish knobs are also written to SharedPreferences `lab-knobs` by MainActivity.onCreate (commit, not apply), because the headless task has no launch intent: it reads the LAST launch's knobs (`lab/probe` knobs)."
  - "(WO-002) The lab's native side is a plugin, app/lab_probe (channel `lab/probe`: args, knobs, probe, verdict), not code in MainActivity: the plugin's HeadlessTask builds its own FlutterEngine, which registers only pubspec plugins, so a channel MainActivity registered would not exist in the headless isolate."
  - "(WO-002) configB64 is FLAT (BackgroundFetchConfig has no groups) and is merged over the driver's defaults {minimumFetchInterval: 15, stopOnTerminate: <the extra>, startOnBoot: false, enableHeadless: true} before the boot configure(). The driver echoes `LAB app=config json={…}` before every configure() it makes."
  - "(WO-002) Each FlutterActivity owns its FlutterEngine, so a recreation or a restart runs main() again in a new isolate: like Capacitor (and unlike React Native), the driver calls configure() on EVERY boot. The Dart plugin keeps the FIRST callbacks a configure() hands it per isolate, so the driver passes stable dispatchers and routes deliveries itself. The first api batch, the anchor line and the slots run on boot 1 only (labkit expects that of a page-reload host)."
  - "(WO-002) Fetch events arrive through configure()'s two callbacks. The driver logs `LAB app=event=fetch|timeout n=<k> taskId=<id>`, hands the taskId to every armed `events:` declaration of `configure`, then finishes per the knobs: `LAB app=finish taskId=… timeout=… after_ms=… outcome=ok|withheld|threw`. The plugin's foreground fetch taskId is `flutter_background_fetch`."
  - "(WO-002) `api` hooks run against the plugin's PUBLISHED Dart surface (BackgroundFetch's static members, as a customer calls them). stop() returned the plugin's Dart `Future<int>` (the status), not a boolean, and api-smoke's stop#5/#7 stayed red on Flutter as a finding (Chris, 2026-11-13), not excused, until WO-011 made it `Future<bool>` (both natives answer `true`): red in sweeps 20261113-175923 and -183048 (Android), 20261114-123454/-123933 and 20261115-195448/-200600 (iOS); green in 20261116-135555 (Android) and -140304/-140744 (iOS). NETWORK_TYPE_* are aliased to `NetworkType.<X>.index` (the Dart enum carries the ints the bridges take)."
  - "(WO-002) Headless runs Dart: the plugin's HeadlessTask starts a FlutterEngine for the callback registered with BackgroundFetch.registerHeadlessTask (main.dart's top-level `labHeadlessTask`). It logs `LAB point=headless event=fetch|timeout taskId=<id> timeout=<bool>`, then `LAB point=task-probe <probe>`, then finishes per the persisted knobs: `LAB point=task-api api=finish args=<taskId> outcome=ok|withheld|threw after_ms=<ms>`. Nothing it logs starts with `point=headless-`."
  - "(WO-002) The probe (`lab/probe` probe, every tick and at onCreate/resume/onDestroy, and `point=appCreate` in LabApplication.onCreate in every process) is React Native's: reflective, never building an SDK singleton — LifecycleManager's and BackgroundFetch's own static instances read BY TYPE (`headless=`, `background=`, `adapter=`), and the SDK's persisted task ids from SharedPreferences TSBackgroundFetch `tasks`."
  - "(WO-002) Native pin: build.sh <label> sets rootProject.ext.backgroundFetchVersion (the plugin's safeExtGet key) and resolves com.transistorsoft:tsbackgroundfetch:<label> ONLY from labs/m2 (exclusiveContent in android/build.gradle.kts), then refuses an APK whose resolved version is not the label or whose AAR is not byte-identical to labs/m2's."
  - "(WO-002) The plugin is STAGED, not linked: build.sh copies the checkout's working-tree files (minus example/) into .stage/background_fetch (gitignored), records the checkout, HEAD, dirty flag and a content hash in .lab-source, and app/pubspec.yaml depends on the stage by path, so neither pub nor Gradle writes into the submodule. build.sh refuses a package_config.json that resolves background_fetch anywhere else."
  - "(WO-002) Proofs, beside the native pin: the dex defines the SDK's, the plugin's, LabProbePlugin's and MainActivity's classes, and the debug APK's Dart kernel carries app/lib/main.dart and every staged lib/**/*.dart byte for byte (a kernel holds each library's source whole). build.sh removes run.py's stamp before it replaces the APK."
  - "(WO-002, 2026-11-13, the review's) KNOWN GAP: run.py's source stamp (vendored from bg-forge, whose Flutter host shares it) hashes app/, build.sh and the plugin checkout, nothing of the Flutter SDK, which supplies the engine, the embedding and the framework compiled into the kernel. After a `flutter upgrade`, `--build stale` keeps the APK the previous SDK built. The SDK levels are literals in app/android/app/build.gradle.kts, so they cannot drift with it; sweep with `--build all` after an SDK change. build.sh's `[lab] built` line names the SDK (flutter=)."
  - "Dart print() lines reach logcat under the tag 'flutter' (on iOS, os_log as `flutter: …`, which the harness strips); the harness matches on substrings."
  - "(WO-002, iOS) Each channel builds its own GENERATED Flutter project, app/build/ios-pods and app/build/ios-spm (gitignored, under a directory run.py's source stamp skips): Flutter takes `enable-swift-package-manager` from the pubspec of the project it runs in, which outranks the global setting (true on this Mac), so a project per channel builds both without editing a tracked file, and app/ stays the Android project.  build.sh writes each project's pubspec (the stage, the switch; no lab_probe), copies app/lib/main.dart in, and runs `flutter create --platforms=ios` inside it (so the template matches its channel), regenerating ios/ when the SDK or the channel changes (ios/.lab-host).  The tracked iOS source is app/native-ios/AppDelegate.swift, copied over the template's (a UIScene app: FlutterSceneDelegate, the implicit engine created when the scene connects)."
  - "(WO-002, iOS) Pins.  pods: Flutter's own Podfile template with static linkage (the plugin's install docs) and `pod 'TSBackgroundFetch', :path => '<the labelled snapshot>'` as a literal, so a label switch changes the Podfile; the plugin is Flutter's development pod (.symlinks/plugins/background_fetch → the stage); Podfile.lock is the record.  spm: the plugin's own `transistor-background-fetch from: 4.2.0` resolved through a SwiftPM mirror of the label tagged with its marketing version (the other hosts' recipe), its mirrors.json in BOTH Xcode containers — Flutter prefetches packages on the project and builds the workspace — and both Package.resolved files must pin the mirror's commit; the plugin package is the stage (ios/Flutter/ephemeral/Packages/.packages/background_fetch).  Either way build.sh proves the linked slice's sha256 and version against the provenance, the one binary carrying PROJECT:TSBackgroundFetch-<build> (Runner.debug.dylib), the plugin's and the SDK's classes, the overlay's lines, the Dart kernel byte for byte, and copies the app to app/build/lab-ios/Runner.app."
  - "(WO-002, iOS) The SDK's version string is linked by `-Wl,-u,_TSBackgroundFetchVersionString` on Runner's three configurations (build.sh; the Capacitor host's rule).  The overlay never imports the SDK: it reaches it by name (the Objective-C runtime, dlsym), so it compiles the same on both channels."
  - "(WO-002, iOS) `lab/probe` is the AppDelegate's channel on the engine (didInitializeImplicitFlutterEngine, the application registrar's messenger: bg-forge's way), not lab_probe's: iOS has no headless engine to reach, and lab_probe stays Android-only, so the spm channel needs no CocoaPods.  Args arrive as argv `--key=value` (simctl launch), returned with the Android channel's keys and TYPES (the driver tests `== true` and `as num`); the knobs are the launch's own; the probe is the Capacitor host's (headless=- sdkBuild= configured= active= stopOnTerminate= subscribers= tasks= pendingFetch= bgTask=).  `point=pluginLoad n=` counts engines (it must stay 1); `point=fireArmed` / `point=fire` are the Darwin custom-task hook."
  - "(WO-002, iOS) The legacy background fetch is forwarded by the PLUGIN (BackgroundFetchPlugin.m:29-34) through FlutterAppDelegate's lifecycle forwarding, the path a customer's app takes; the host's AppDelegate only wraps it (`point=legacyFetch` before, `point=legacyFetchForward plugins=<bool>` after, `point=legacyFetchComplete result=` from the wrapped handler); if no plugin took it, UIKit's handler is left uncalled, as in a customer's app (SpringBoard records the failure), never completed by the host.  The launch call (ios-registration's --sdkLaunchCall=delegate|scene|none) is the host's; the plugin's own application:didFinishLaunchingWithOptions: makes another when the engine replays the launch at the scene, so `none` no longer isolates +load (as on Capacitor)."
  - "(WO-002, iOS, MEASURED 2026-11-14) The driver's periodic native calls (the verdict every 250 ms, the 4 s tick) do NOT keep a Flutter app awake in the background, unlike the Capacitor page's, so the driver does not pause while hidden.  With the push then 5 s after the `background` action, the Simulator suspended it 0.5-0.6 s after the action in the 12 launches of six rounds (sweeps 20261114-115848 to -120704, both channels; bgSilenceMs 4407-4499; the first SwiftPM sweep, -115249, read 4471 and 4509), and 2.0 and 3.0 s in the first pods sweep (-114801: bgSilenceMs 2960 and 2047, a sound run 47 ms above the bound; cause not established — every step reinstalls the app).  So ios-fetch-sim and ios-timeout-sim now push 8 s after the action."
