include ':app'
// LAB: no `capacitor-cordova-android-plugins` — that subproject is generated by `cap sync`, which the lab never runs
// (it would drop the plugin under test); the lab has no Cordova plugins to wrap.

apply from: 'capacitor.settings.gradle'
// LAB (WO-002): the plugin under test, ALWAYS the stage build.sh copied the checkout into (-PlabPluginDir=<stage>/android).
// No default: one pointing into the submodule would have Gradle write android/build/ into a checkout the lab only reads.
def labPluginDir = providers.gradleProperty('labPluginDir').getOrNull()
if (labPluginDir == null) {
    throw new GradleException("[lab] -PlabPluginDir=<stage>/android is required (use ../../build.sh <label> <plugin>)")
}
include ':transistorsoft-capacitor-background-fetch'
project(':transistorsoft-capacitor-background-fetch').projectDir = new File(labPluginDir)
