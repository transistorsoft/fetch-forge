# Capacitor platform manifest — fetch lab (WO-002).  Ported from bg-forge's labs/platforms/capacitor (bg-forge
# addc50501, byte-identical there to the vendored 76f6536ac): a stock Capacitor 8.5.3 Android project, never run
# through `cap sync`, here driving @transistorsoft/capacitor-background-fetch.  The template's android:configChanges
# are untouched — that omission is what makes the bold and fontscale triggers recreate the Activity.
#
# (WO-002, 2026-11-13) Android and, on the Simulator, iOS on both channels (pods, spm).  Chris's order: Capacitor
# Android, then Capacitor iOS, then Flutter, then Cordova.
name: capacitor
# Its column on a board, and its place in a sweep's queue and build pass (bg-forge's Capacitor column).
column: 3
short: cap                        # its name in a board's eight-character column (labkit.board_name)
# Distinct from bg-forge's com.transistorsoft.labs.* (WO-002 "Distinct package ids"): the two labs share the Lab
# devices and their claims, and each lab's first step evicts every other lab app by prefix (bg-forge WO-191).
package: com.transistorsoft.fetchlab.capacitor
activity: .MainActivity

build:
  cwd: platforms/capacitor
  cmd: ["./build.sh", "{native}", "{plugin}"]
  apk: platforms/capacitor/app/android/app/build/outputs/apk/debug/app-debug.apk

# Web assets are copied by hand (run.py copies www/ before the build): `npx cap sync` would regenerate
# capacitor.plugins.json and the plugin wiring, silently swapping the plugin under test for the published one.
# build.sh writes capacitor.plugins.json itself and bundles the plugin's PUBLISHED surface (src/index.ts) into
# assets/public/bg.js beside the copied www/.
web:
  src: platforms/capacitor/app/www
  dest: platforms/capacitor/app/android/app/src/main/assets/public

# (WO-002, iOS) The Simulator host: @capacitor/cli 8.5.3's CocoaPods template, generated by build.sh, with
# app/native-ios/AppDelegate.swift over its AppDelegate (the Lab and Console plugins live there too).
ios:
  package: com.transistorsoft.fetchlab.capacitor
  build:
    cwd: platforms/capacitor
    cmd: ["./build.sh", "{native}", "{plugin}"]
    # One artifact whichever channel built it (bg-forge WO-192 D2): build.sh copies the app it proved here.
    app: platforms/capacitor/app/build/lab-ios/App.app
    # How the app gets TSBackgroundFetch: a variant's `channel:` picks one (LAB_CHANNEL); none is pods.
    channels: [pods, spm]
    env:
      LAB_OS: ios
      LAB_BUNDLE: com.transistorsoft.fetchlab.capacitor
      LAB_XCFRAMEWORKS: "{labs}/xcframeworks"       # labs/harness/publish_native_fetch_ios.sh writes it
  supports:
    triggers: [none]
    calls: []

plugins:
  worktree: default          # the checkout default_checkout names (build.sh stages a copy of it)

# The checkout `default` builds.  run.py hashes its HEAD and working tree into the source stamp, so a plugin
# commit invalidates the installed app instead of passing for it.
default_checkout: "{repo}/capacitor/background-fetch"

supports:
  # The template's android:configChanges omits fontScale and fontWeightAdjustment, so bold and fontscale recreate
  # the Activity; `finish` is the second `am start --ez finishNow true`.
  triggers: [bold, fontscale, finish, none]
  calls: []                  # no legacy tick-counted `call` hooks: fetch scenarios use `api` hooks

notes:
  - "(WO-002) Launch extras honoured, as React Native's: configB64/hooksB64/eventsB64/scenario/nativeLabel/view/stopOnTerminate/finishNow, and the fetch knobs noConfigure (bool), finishDelayMs (int, default 1000), withholdFinish (bool), finishOnTimeout (bool, default true), restartOnFinish (bool, WO-007: finishNow then restarts the app — finish(), then startActivity() of a copy of the launch intent, so the page reloads as boot 2 and configures again; restart-foreground-android). Read whatever type `am start` sent them as (--ez/--ei/--es). The boot line's args= lists what was honoured."
  - "(WO-002) The three finish knobs are also written to SharedPreferences `lab-knobs` by MainActivity.onCreate (commit, not apply), because the headless task has no launch intent: it reads the LAST launch's knobs."
  - "(WO-002) configB64 is FLAT (BackgroundFetchConfig has no groups) and is merged over the driver's defaults {minimumFetchInterval: 15, stopOnTerminate: <the extra>, startOnBoot: false, enableHeadless: true} before the boot configure(). The driver echoes `LAB app=config json={…}` before every configure() it makes."
  - "(WO-002) A recreation builds a new Bridge, new plugin instances and a new WebView, so the page reloads: unlike React Native, the driver calls configure() on EVERY page boot, which re-binds the SDK's callback to the new plugin instance. The first api batch, the anchor line and the slots run on boot 1 only (labkit expects that of a page-reload host)."
  - "(WO-002) Fetch events arrive through configure()'s two callbacks. The driver logs `LAB app=event=fetch|timeout n=<k> taskId=<id>`, hands the taskId to every armed `events:` declaration of `configure` (EventBG, as React Native's), then finishes per the knobs: `LAB app=finish taskId=… timeout=… after_ms=… outcome=ok|withheld|rejected|threw` (Capacitor's finish() returns a Promise, so it is awaited)."
  - "(WO-002) `api` hooks run against the PUBLISHED surface — BGFetch.BackgroundFetch, the class src/index.ts exports and a customer imports, bundled by build.sh — never Capacitor.Plugins.BackgroundFetch, the native @PluginMethod roster."
  - "(WO-002) Headless is Java-only on Capacitor: no JavaScript runs headless. BackgroundFetchHeadlessTask sits at <applicationId>.BackgroundFetchHeadlessTask (BackgroundFetchPlugin.java's lookup: getPackageName() + '.BackgroundFetchHeadlessTask', so no applicationIdSuffix). It logs `LAB point=headless event=fetch|timeout taskId=<id> timeout=<bool>`, then `LAB point=task-probe <probe>`, then finishes per the persisted knobs: `LAB point=task-api api=finish args=<taskId> outcome=ok|withheld|threw after_ms=<ms>`. Nothing it logs starts with `point=headless-`."
  - "(WO-002) The probe (`Lab.probe()`, every tick and at onCreate/resume/onDestroy, and `point=appCreate` in LabApplication.onCreate in every process) is React Native's: reflective, never building an SDK singleton — LifecycleManager's and BackgroundFetch's own static instances read BY TYPE (`headless=`, `background=`, `adapter=`), and the SDK's persisted task ids from SharedPreferences TSBackgroundFetch `tasks`."
  - "(WO-002) Native pin: build.sh <label> resolves com.transistorsoft:tsbackgroundfetch:<label> ONLY from labs/m2 (exclusiveContent in android/build.gradle; the label is required, the plugin's own `4.1.+` never applies), then refuses an APK whose resolved version is not the label or whose AAR is not byte-identical to labs/m2's."
  - "(WO-002) The plugin is STAGED, not linked: build.sh copies the checkout's working-tree files (minus example/) into .stage/capacitor-background-fetch (gitignored), records the checkout, HEAD, dirty flag and a content hash in .lab-source, and builds the plugin's android/ from there, so Gradle never writes into the submodule."
  - "(WO-002) bg.js is bundled by esbuild from the stage's src/index.ts with @capacitor/core resolved from THIS app's node_modules (NODE_PATH), never the checkout's: the core inlined into bg.js must be the version whose native bridge the app runs (@capacitor/android 8.5.3; the checkout's lock holds 8.3.0). build.sh proves it from esbuild's metafile."
  - "(WO-002, 2026-11-12, MEASURED) @transistorsoft/background-fetch-types is aliased to an empty module while bundling, as the plugin's own tsc build erases it: src/definitions.ts re-exports three interfaces with a value-form `export {…} from`, which tsc drops (dist/esm/definitions.js imports nothing from the package) but esbuild keeps, and the types package's runtime JS throws on load (1.0.0 dist/BackgroundFetch.js: `exports.default = BackgroundFetch;`, never defined). The first api-constants run died in bg.js with `ReferenceError: BackgroundFetch is not defined`. build.sh refuses the alias if src ever takes anything but those erased type names from the package."
  - "JS console lines reach logcat under the tag Capacitor/Console, wrapped in 'File: … - Msg: …'; the harness matches on substrings."
  - "(WO-002, iOS) The host is GENERATED by build.sh from @capacitor/cli 8.5.3's own template — app/ios/ from ios-pods-template.tar.gz (channel pods), app/build/ios-spm/ from ios-spm-template.tar.gz (channel spm), both gitignored and under a directory run.py's source stamp skips, regenerated when the template changes — plus by hand what `cap sync ios` would write (App/public, capacitor.config.json with packageClassList [BackgroundFetchPlugin, LabPlugin, LabConsolePlugin], config.xml, UIBackgroundModes fetch+processing, BGTaskSchedulerPermittedIdentifiers com.transistorsoft.fetch + com.transistorsoft.fetchlab.task).  The tracked piece is app/native-ios/AppDelegate.swift: the template's AppDelegate plus the Lab and Console plugins.  The template's SceneDelegate is used as generated: it builds the bridge in willConnect, so the plugin's load() (which calls the SDK's didFinishLaunching()) runs from the scene."
  - "(WO-002, iOS) Pins: pods — the Podfile's capacitor_pods names the stage and the labelled snapshot by :path (Podfile.lock is the record).  spm — CapApp-SPM/Package.swift as `cap sync` writes it (capacitor-swift-pm exact @capacitor/ios, the plugin as a path package: the stage), and the plugin's own `transistor-background-fetch from: 4.2.0` resolved through a SwiftPM mirror of the label tagged with its marketing version (the React Native host's recipe; Package.resolved is the record).  Either way build.sh proves the linked slice's sha256 and version against the provenance, the one binary carrying PROJECT:TSBackgroundFetch-<build>, the four classes, the legacy-fetch forward, and copies the app to app/build/lab-ios/App.app."
  - "(WO-002, iOS) The SDK's version string is linked by `-Wl,-u,_TSBackgroundFetchVersionString` on the App target (build.sh): no SDK code references it, the slice is a static archive, and a Swift file cannot name a C array (the React Native host references it from LabModule.m).  LabPlugin reads it back by dlsym for the probe's sdkBuild=."
  - "(WO-002, iOS) Args arrive as argv `--key=value` (simctl launch), read by LabPlugin (AppDelegate.swift) with LabPlugin.java's keys; the knobs are the launch's own (iOS has no headless mode; an OS launch has none: the defaults).  The probe is the React Native host's: headless=- sdkBuild= configured= active= stopOnTerminate= subscribers= tasks= pendingFetch= bgTask=, read through the Objective-C runtime.  The AppDelegate forwards UIKit's legacy background fetch (`LAB point=legacyFetch …` / `legacyFetchComplete result=`), logs didFinishLaunching / sceneWillConnect / sdkLaunchCall (ios-registration's --sdkLaunchCall=delegate|scene|none; the scene call via UIScene.willConnectNotification, the template's SceneDelegate untouched), and LabPlugin logs `point=pluginLoad n=` (it must stay 1) and arms the Darwin custom-task hook (`point=fireArmed`, `point=fire kind= taskId= found= ran=`)."
  - "(WO-002, iOS) JS console lines never reach os_log on their own (Capacitor's Console plugin prints to stdout): LabConsolePlugin takes the `Console` name and NSLogs each message, returning nothing.  build.sh refuses an @capacitor/ios whose native-bridge.js no longer routes console there."
  - "(WO-002, iOS, MEASURED 2026-11-13) The driver's periodic native calls (Lab.verdict every 250 ms, the probe tick every 4 s) pause while the page is hidden, on iOS only (www/index.html PAUSE_HIDDEN): with them running a Capacitor iOS app was NEVER suspended in the background (its beat logged every second until the fetch), so a `background` step tested no suspended wake.  Paused, the app is suspended 1-2.5 s after backgrounding, as the React Native host's is (bgSilenceMs reads the beat's silence, >=2000 in ios-fetch-sim `background` and ios-timeout-sim; ~1000 with the polling on); a woken fetch reaches the page within ms, timers run (throttled to ~1 s) while the SDK holds background time, and a cold background launch connects a scene, loads the bridge (`pluginLoad n=1 state=background`) and boots the page hidden in ~1.2 s, while the SDK holds the fetch until configure().  The driver logs `app=visibility hidden=…` at boot and on each change."
  - "(WO-002, iOS, MEASURED 2026-11-13) When the page finishes a woken fetch, iOS suspends the app as soon as the SDK completes it (after the SDK's own expiry it keeps running ~5 s more), so the reply to the driver's `await BackgroundFetch.finish()` — and its `app=finish … outcome=ok` line — may only reach the page at the next wake (ios-fetch-sim `background`: a race, driverFinishes not pinned for Capacitor there).  For a customer: on iOS, code after `await BackgroundFetch.finish()` may not run until the next wake."
