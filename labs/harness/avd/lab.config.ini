# config.ini of the lab's AVDs Lab1 and Lab2 (Tier C, C7.7).  lab_devices.py writes it to
# ~/.android/avd/<name>.avd/config.ini when it creates one, with {name} filled in and these comment
# lines left out.  avdmanager has no pixel_9 device on this machine, so an AVD is written, not made.
#
# The key set is Pixel_9_API_36's (emulator-5554) on 2026-09-26: android-36 google_apis_playstore
# arm64-v8a, the Pixel 9 profile at 1080x2424, 7487 MB RAM, 6 GB /data.  Changed from it:
#   AvdId, avd.ini.displayname    the AVD's own name, {name}
#   skin.path                     was /Users/chris/Library/Android/sdk/skins/pixel_9, one machine's
#                                 absolute path; now SDK-relative, the form the SDK tools once wrote
#                                 (lab_devices.py refuses to create an AVD when <sdk>/skins/pixel_9 is missing)
#   fastboot.chosenSnapshotFile   dropped: it names one session's snapshot file (empty there), and a
#                                 lab boot never loads a snapshot (lab_devices.py launches -no-snapshot)
# hw.sdCard and sdcard.size stay, but no sdcard.img is made — as for the Pixel_9_API_36_lab2 clone,
# which runs with no SD card attached.  The lab never writes to one.
AvdId={name}
PlayStore.enabled=true
abi.type=arm64-v8a
avd.ini.displayname={name}
avd.ini.encoding=UTF-8
disk.dataPartition.size=6442450944
fastboot.forceChosenSnapshotBoot=no
fastboot.forceColdBoot=no
fastboot.forceFastBoot=yes
hw.accelerometer=yes
hw.arc=false
hw.audioInput=yes
hw.battery=yes
hw.camera.back=virtualscene
hw.camera.front=emulated
hw.cpu.arch=arm64
hw.cpu.ncore=4
hw.dPad=no
hw.device.hash2=MD5:5478e3411cc0e0441240e736eb14c07a
hw.device.manufacturer=Google
hw.device.name=pixel_9
hw.gps=yes
hw.gpu.enabled=yes
hw.gpu.mode=auto
hw.gyroscope=yes
hw.initialOrientation=portrait
hw.keyboard=yes
hw.lcd.density=420
hw.lcd.height=2424
hw.lcd.width=1080
hw.mainKeys=no
hw.ramSize=7487
hw.sdCard=yes
hw.sensors.light=yes
hw.sensors.magnetic_field=yes
hw.sensors.orientation=yes
hw.sensors.pressure=yes
hw.sensors.proximity=yes
hw.trackBall=no
image.sysdir.1=system-images/android-36/google_apis_playstore/arm64-v8a/
runtime.network.latency=none
runtime.network.speed=full
sdcard.size=512M
showDeviceFrame=yes
skin.dynamic=yes
skin.name=pixel_9
skin.path=skins/pixel_9
tag.display=Google Play
tag.displaynames=Google Play
tag.id=google_apis_playstore
tag.ids=google_apis_playstore
target=android-36
vm.heapSize=228
