name: api-smoke-ios
description: >
  (WO-002, Tier 1) api-smoke on iOS: every member of the default export, called through the surface a customer calls,
  settles with the shape the types declare, after the driver's own boot configure() has resolved.  Its own scenario,
  as bg-forge splits an API scenario per OS (api-config-invalid-ios / -android): on the Simulator scheduleTask
  rejects, and what else is read is BGTaskScheduler's, not JobScheduler's.

  WHAT EACH HOOK ASSERTS (types/background-fetch 5c9685d2 src/BackgroundFetch.ts; labs/harness/vocabulary.yaml):
    * configure and registerHeadlessTask — probes, never calls, as on Android (api-smoke).  registerHeadlessTask is
      AppRegistry's on both OSes (the plugin's index.js:65-67 at 85a6bf4); iOS has no headless mode to run it.
    * status() and start() — resolve a BackgroundFetchStatus, one of 0/1/2.  On iOS it is UIApplication's
      backgroundRefreshStatus (TSBackgroundFetch.m:201-206), and start() resolves only when it is Available and
      rejects otherwise (RNBackgroundFetch.mm:65-84 at 85a6bf4); the value is recorded on the line.
    * scheduleTask(TaskConfig) — REJECTS on the Simulator: BGTaskScheduler is unavailable there (WO-002, "Not an
      acceptable shortcut").  The task is the one the iOS host's Info.plist permits, com.transistorsoft.fetchlab.task,
      so the rejection is the Simulator's (taskSubmitErrors), not an identifier the app does not permit.
    * stop(taskId) and stop() — resolve a boolean, true.  The bridge resolves YES whatever the SDK did
      (RNBackgroundFetch.mm:86-97), so what they did is read below.
    * finish(taskId) — void (undefined).  With the fetch taskId and no fetch running, the SDK logs `[TSBackgroundFetch
      finish] react-native-background-fetch Called without a task to finish.  Ignoring.` (TSBackgroundFetch.m:348).

  WHAT ELSE IT READS (the hooks alone pass with a broken SDK, as on Android):
    * bgSubmits `com.transistorsoft.fetch:appRefresh=1,com.transistorsoft.fetchlab.task:processing=1`:
      BGTaskScheduler's own record of the requests the SDK handed it, configure()'s fetch request and scheduleTask()'s
      processing request; start() adds none (the SDK's fetchScheduled guard, TSBackgroundFetch.m:104).  Android's
      jobsRegistered is the counterpart; like it, this shows the SDK asked, not that the OS took the request.
    * taskSubmitErrors `BGTaskSchedulerErrorDomain:1=1`: scheduleTask's rejection is the Simulator's Unavailable.
    * bgCancels `com.transistorsoft.fetch=1,com.transistorsoft.fetchlab.task=1`: stop(taskId) cancelled the task's
      request and stop() the fetch's (BGTaskScheduler's own `cancelTaskRequestWithIdentifier:` lines).
    * sdkTasks `-` and sdkSubscribers `-`: at the step's end the SDK lists no task (stop(taskId) destroyed it) and no
      fetch listener (stop() removed the plugin's).  Android's jobIds `-` is the counterpart.
    * MEASURED 2026-11-11 on Lab1 (iPhone 17 Pro Simulator, iOS 27.2; native 4.1.1-master-5de5242, plugin 85a6bf4).
platforms: [react-native]
not_applicable:
  capacitor: "2026-11-12 — no Capacitor iOS host yet (WO-002: Capacitor Android first, then iOS on CocoaPods
    and SwiftPM)."
  android: "2026-11-11 — api-smoke is Android's: its scheduleTask resolves, and it reads JobScheduler's jobs."
measure_from: launch
settle: 10
after: 30
hooks:
  - api: configure
    probe: true
    returns: {$: {type: function}}
  - api: registerHeadlessTask
    probe: true
    returns: {$: {type: function}}
  - api: status
    returns: {$: {type: number, in: [0, 1, 2]}}
  - api: start
    returns: {$: {type: number, in: [0, 1, 2]}}
  - api: scheduleTask
    args: {taskId: com.transistorsoft.fetchlab.task, delay: 600000, periodic: false}
    outcome: rejected
  - api: stop
    args: com.transistorsoft.fetchlab.task
    returns: {$: {type: boolean, equals: true}}
  - api: finish
    args: react-native-background-fetch
    returns: {$: {type: undefined}}
  - api: stop
    returns: {$: {type: boolean, equals: true}}
expect:
  crashes: 0
  bgSubmits: "com.transistorsoft.fetch:appRefresh=1,com.transistorsoft.fetchlab.task:processing=1"
  taskSubmitErrors: "BGTaskSchedulerErrorDomain:1=1"
  bgCancels: "com.transistorsoft.fetch=1,com.transistorsoft.fetchlab.task=1"
  sdkTasks: "-"
  sdkSubscribers: "-"
