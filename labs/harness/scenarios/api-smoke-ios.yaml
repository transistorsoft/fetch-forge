name: api-smoke-ios
description: >
  (WO-002, Tier 1) api-smoke on iOS: every member of the default export, called through the surface a customer calls,
  settles with the shape the types declare, after the driver's own boot configure() has resolved.  Its own scenario,
  as bg-forge splits an API scenario per OS (api-config-invalid-ios / -android): on the Simulator scheduleTask
  rejects, and what else is read is BGTaskScheduler's, not JobScheduler's.

  WHAT EACH HOOK ASSERTS (types/background-fetch 5c9685d2 src/BackgroundFetch.ts; labs/harness/vocabulary.yaml):
    * configure and registerHeadlessTask — probes, never calls, as on Android (api-smoke).  registerHeadlessTask is
      AppRegistry's on both OSes (the plugin's index.js:65-67 at 85a6bf4); iOS has no headless mode to run it.
    * status() and start() — resolve a BackgroundFetchStatus, one of 0/1/2.  On iOS it is UIApplication's
      backgroundRefreshStatus (TSBackgroundFetch.m:201-206), and start() resolves only when it is Available and
      rejects otherwise (RNBackgroundFetch.mm:65-84 at 85a6bf4); the value is recorded on the line.
    * scheduleTask(TaskConfig) — REJECTS on the Simulator: BGTaskScheduler is unavailable there (WO-002, "Not an
      acceptable shortcut").  The task is the one the iOS host's Info.plist permits, com.transistorsoft.fetchlab.task,
      so the rejection is the Simulator's (taskSubmitErrors), not an identifier the app does not permit.
    * stop(taskId) and stop() — resolve a boolean, true.  The bridge resolves YES whatever the SDK did
      (RNBackgroundFetch.mm:86-97), so what they did is read below.
    * finish(taskId) — void (undefined).  With the fetch taskId and no fetch running, the SDK logs `[TSBackgroundFetch
      finish] react-native-background-fetch Called without a task to finish.  Ignoring.` (TSBackgroundFetch.m:348).
      (WO-002, 2026-11-13) On Capacitor that id is not its fetch's (`capacitor-background-fetch`): the same no-op, and
      the same line (as api-smoke.yaml says for Android).  Capacitor's start() is declared CAPPluginReturnCallback
      (BackgroundFetchPlugin.swift), so its promise resolves undefined: start#3 reads red there (suspected defect 1).
      (WO-002, 2026-11-13) Asserted `null|undefined`, the wire's two spellings of void, as in api-smoke (Flutter's
      Dart driver reports what finish()'s declared `Future<void>` hands a caller, null; Chris's decision).

  WHAT ELSE IT READS (the hooks alone pass with a broken SDK, as on Android):
    * bgSubmits `com.transistorsoft.fetch:appRefresh=1,com.transistorsoft.fetchlab.task:processing=1`:
      BGTaskScheduler's own record of the requests the SDK handed it, configure()'s fetch request and scheduleTask()'s
      processing request; start() adds none (the SDK's fetchScheduled guard, TSBackgroundFetch.m:104).  Android's
      jobsRegistered is the counterpart; like it, this shows the SDK asked, not that the OS took the request.
    * taskSubmitErrors `BGTaskSchedulerErrorDomain:1=1`: scheduleTask's rejection is the Simulator's Unavailable.
    * bgCancels `com.transistorsoft.fetch=1,com.transistorsoft.fetchlab.task=1`: the task's request and the fetch's
      were cancelled (BGTaskScheduler's own `cancelTaskRequestWithIdentifier:` lines).
    * sdkTasks `-` and sdkSubscribers `-`: at the step's end the SDK lists no task and no fetch listener.  Android's
      jobIds `-` is the counterpart.
    * (2026-11-15, the review) Neither row says WHICH stop did it: both are tallies at the step's end, and the SDK's
      stop() with no taskId also cancels and destroys every task (TSBackgroundFetch.m stop:).  On Cordova, until
      WO-009, stop#5 reached nothing native and both rows read the task gone from stop#7 alone; with the fix stop#5
      cancels it (`[TSBackgroundFetch stop] com.transistorsoft.fetchlab.task`, then `cancelTaskRequestWithIdentifier:
      com.transistorsoft.fetchlab.task`, sweeps 20261116-124433 FIX and -124612 FIX-SPM).  stop(taskId)'s own effect is
      unpinned here (a WO-002 open item: an ordered reading between stop#5 and stop#7).
    * MEASURED 2026-11-11 on Lab1 (iPhone 17 Pro Simulator, iOS 27.2; native 4.1.1-master-5de5242, plugin 85a6bf4).

  (WO-002, 2026-11-15) Cordova (SwiftPM, cordova-ios 8.1.1; sweeps 20261115-223641 FIX, -224122 FIX-SPM): red, the
  callback-style finding api-smoke reads on Android (Chris's decision: findings).  status#2 and start#3 read undefined,
  scheduleTask#4 resolves (nothing to reject: it returns nothing), stop#7 reads undefined, and stop#5 THROWS: stop(taskId)
  hands the id to cordova.js as the success callback, and iOSExec refuses a string as exec's first argument, so nothing
  reaches native (on Android the same call cancels every task); bgCancels and sdkTasks read the task gone all the
  same, from stop#7's stop-everything.  registerHeadlessTask is absent (absent_on).  Two
  more metrics can read red with them, and they are the same finding, a race: bgSubmits `appRefresh=2` and
  sdkSubscribers `cordova-background-fetch`.  The plugin's start does its work in the SDK's asynchronous status
  callback (CDVBackgroundFetch.m start:), and the callback-style start gives a caller nothing to wait on, so the hooks
  run on and start's native half can land AFTER stop#7's: in FIX-SPM `[TSBackgroundFetch stop]` at 13.427,
  `[TSBackgroundFetch start]` with a second submit at 13.428, both rows red; in FIX start at 40.344 and stop at 40.345,
  both rows ok (MEASURED, the 2026-11-15 captures, whose logcats WO-009's sweeps overwrote: the times survive only
  here and in WO-009's Diagnosis).  A customer who calls start() then stop() without chaining the
  callbacks gets either order (WO-009).

  (WO-009, 2026-11-16) Green on WO-009's fix, three sweeps per channel (20261116-123205, -124114, -124433 FIX;
  -123640, -124254, -124612 FIX-SPM): every return as the types declare, scheduleTask#4 rejected with iOS's message,
  stop#5 reaching native (`[TSBackgroundFetch stop] com.transistorsoft.fetchlab.task`) before it settles, and start's
  native half before start#3 returns, so bgSubmits `appRefresh=1` and sdkSubscribers `-` each time.
platforms: [react-native, capacitor, flutter, cordova]
not_applicable:
  android: "2026-11-11 — api-smoke is Android's: its scheduleTask resolves, and it reads JobScheduler's jobs."
measure_from: launch
settle: 10
after: 30
hooks:
  - api: configure
    probe: true
    returns: {$: {type: function}}
  - api: registerHeadlessTask
    probe: true
    returns: {$: {type: function}}
    absent_on:
      capacitor: "2026-11-13 — iOS has no headless mode, and src/index.ts's BackgroundFetch declares no
        registerHeadlessTask (as api-smoke.yaml, WO-002)."
      cordova: "2026-11-15 — iOS has no headless mode, and src/typescript/index.ts declares no
        registerHeadlessTask (as api-smoke.yaml, WO-002)."
  - api: status
    returns: {$: {type: number, in: [0, 1, 2]}}
  - api: start
    returns: {$: {type: number, in: [0, 1, 2]}}
  - api: scheduleTask
    args: {taskId: com.transistorsoft.fetchlab.task, delay: 600000, periodic: false}
    outcome: rejected
  - api: stop
    args: com.transistorsoft.fetchlab.task
    returns: {$: {type: boolean, equals: true}}
  - api: finish
    args: react-native-background-fetch
    returns: {$: {type: null|undefined}}
  - api: stop
    returns: {$: {type: boolean, equals: true}}
expect:
  crashes: 0
  bgSubmits: "com.transistorsoft.fetch:appRefresh=1,com.transistorsoft.fetchlab.task:processing=1"
  taskSubmitErrors: "BGTaskSchedulerErrorDomain:1=1"
  bgCancels: "com.transistorsoft.fetch=1,com.transistorsoft.fetchlab.task=1"
  sdkTasks: "-"
  sdkSubscribers: "-"
