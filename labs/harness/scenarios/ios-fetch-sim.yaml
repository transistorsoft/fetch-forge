name: ios-fetch-sim
description: >
  (WO-002 phase 2a, D3) A background fetch on the iOS Simulator, as SpringBoard delivers one, in the three states an
  app can be in.  BGTaskScheduler is unavailable on the Simulator; the SDK falls back to the legacy API
  (TSBackgroundFetch.m:117-122, setMinimumBackgroundFetchInterval from configure()), and `xcrun simctl push` with
  {"aps":{"content-available":1}} has SpringBoard send the app UIKit's legacy background fetch (`fire: fetch`;
  MEASURED 2026-11-10).  The lab AppDelegate forwards it to the SDK (`LAB point=legacyFetch`), the SDK hands it to the
  plugin, the driver finishes it 1 s later, and the SDK completes UIKit's handler (`LAB point=legacyFetchComplete`),
  which SpringBoard records (`… with result: …`).

  WHAT EACH STEP READS:
    * foreground: the app on screen; the fetch is delivered `active`.
    * background: Settings launched over the app (`background: true`); the Simulator suspends it within 1 s, and the
      push resumes it in the background.
    * cold: the app terminated (`terminate: true`); the push launches it in the background, with no launch args, so
      the driver configures with its defaults and the delivery reaches that configure (no `events:` arm survives the
      relaunch).  The SDK reloads its persisted subscriber at +load, so the fetch is not lost while JavaScript boots
      (MEASURED 2026-11-10).
    * Each: the SDK's own `performFetchWithCompletionHandler` and `finish … (1 of 1)` lines, the driver's delivery,
      UIKit's result `newData`, and SpringBoard's `RetrievedNewData`.
platforms: [react-native, capacitor]
not_applicable:
  android: "2026-11-10 — `fire:`, `background:` and `terminate:` are the Simulator's (a SpringBoard background fetch);
    Android's fetches are JobScheduler's, events-fetch-android's."
measure_from: launch
# (WO-002, Capacitor iOS) Each bridge delivers its own fetch taskId: `returns` takes either, driverTally pins each.
platform_expect:
  react-native: {driverTally: "fetch:react-native-background-fetch=1"}
  capacitor: {driverTally: "fetch:capacitor-background-fetch=1"}
steps:
  - name: foreground
    settle: 10
    after: 15
    hooks:
      - api: status
        returns: {$: {type: number, in: [0, 1, 2]}}
    events:
      - subscribe: configure
        args: {minimumFetchInterval: 15, stopOnTerminate: true, enableHeadless: false, startOnBoot: false}
        min: 1
        max: 1
        returns: {$: {type: string, in: [react-native-background-fetch, capacitor-background-fetch]}}
    actions:
      - {after: {api: "status#0"}, delay_s: 3, fire: fetch}
    expect:
      crashes: 0
      fetchReceived: 1
      fetchFinished: 1
      driverEvents: "fetch=1"
      driverFinishes: "fetch:ok=1"
      legacyFetchStates: "active=1"
      legacyResults: "newData=1"
      springboardResults: "RetrievedNewData=1"
  - name: background
    settle: 10
    after: 15
    hooks:
      - api: status
        returns: {$: {type: number, in: [0, 1, 2]}}
    events:
      - subscribe: configure
        args: {minimumFetchInterval: 15, stopOnTerminate: true, enableHeadless: false, startOnBoot: false}
        min: 1
        max: 1
        returns: {$: {type: string, in: [react-native-background-fetch, capacitor-background-fetch]}}
    actions:
      - {after: {api: "status#0"}, delay_s: 2, background: true}
      - {after: {api: "status#0"}, delay_s: 7, fire: fetch}
    # (WO-002, Capacitor iOS, MEASURED 2026-11-13) A woken Capacitor app is suspended again as soon as the SDK
    # completes the fetch, so the reply to the driver's `await BackgroundFetch.finish()` — and the
    # `app=finish … outcome=ok` it logs — can reach the page only at its next wake: in sweep 20261113-113435
    # driverFinishes read `-` while the SDK's own `finish … (1 of 1)` came 1.0 s after the delivery; the committed
    # captures got the reply 66 ms after it.  A race, so it is not pinned either way.  fetchFinished 1, legacyResults newData and RetrievedNewData stay the
    # proof that the page finished: the SDK's own expiry, ~26 s after the push, falls after this window.  A step-level
    # platform_expect replaces the scenario's, so driverTally is restated.
    platform_expect:
      react-native: {driverTally: "fetch:react-native-background-fetch=1"}
      capacitor: {driverTally: "fetch:capacitor-background-fetch=1", driverFinishes: any}
    expect:
      crashes: 0
      fetchReceived: 1
      fetchFinished: 1
      driverEvents: "fetch=1"
      driverFinishes: "fetch:ok=1"
      legacyFetchStates: "background=1"
      legacyResults: "newData=1"
      springboardResults: "RetrievedNewData=1"
      # (WO-002, Capacitor iOS) The app really slept before the push: the driver's beat fell silent for seconds.  A
      # driver kept awake reads ~1000 (the Capacitor driver's native polling did, until it paused while hidden).
      bgSilenceMs: ">=2000"
  # (WO-002, Capacitor iOS) The cold page is a background app too, suspended again once the SDK completes: its reply
  # to `await finish()` has the same race as `background`, but came 81-82 ms after the SDK's finish in every capture
  # (FIX, FIX-SPM), so driverFinishes stays pinned.  A cold `-` with fetchFinished, legacyResults and
  # RetrievedNewData green is that race, not the bridge.
  - name: cold
    settle: 10
    after: 20
    hooks:
      - api: status
        returns: {$: {type: number, in: [0, 1, 2]}}
    actions:
      - {after: {api: "status#0"}, delay_s: 2, terminate: true}
      - {after: {api: "status#0"}, delay_s: 5, fire: fetch}
    expect:
      crashes: 0
      fetchReceived: 1
      fetchFinished: 1
      driverEvents: "fetch=1"
      driverFinishes: "fetch:ok=1"
      legacyFetchStates: "background=1"
      legacyResults: "newData=1"
      springboardResults: "RetrievedNewData=1"
