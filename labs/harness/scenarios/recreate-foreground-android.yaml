name: recreate-foreground-android
description: >
  (WO-002, suspected defect 10 — a measurement, PREDICTED RED) A configuration-change recreation must leave the app in
  the foreground as far as the SDK knows.  From the code it does not:
    * React Native destroys the old Activity's host on a recreation — ReactActivityDelegate.onDestroy →
      ReactHostImpl.onHostDestroy (the old Activity is still current) → ReactContext.onHostDestroy — with no
      isChangingConfigurations check, and the plugin's onHostDestroy calls LifecycleManager.setHeadless(true)
      (RNBackgroundFetchModule.java:113-117).
    * Nothing sets it back: the plugin's onHostResume does not (:98-103); LifecycleManager returns to false only on
      ProcessLifecycleOwner's ON_START / ON_RESUME (LifecycleManager.java:142-159, :185-194), which it does not send
      when the new Activity resumes within 700 ms of the old one pausing — a recreation (bg-forge's RN capture of
      recreate-bold-no-stop-on-terminate: ~50 ms).
  So the next fetch, with the app on screen, takes doFetch's headless branch: with stopOnTerminate true (the default)
  `- Stopping on terminate` cancels the job; with false, the HeadlessTask returns silently because RN is RESUMED
  (HeadlessTask.java:68-70) and the BGTask is stranded.  bg-forge pins background-geolocation's version of this.

  Caused with `trigger: bold` (the system bold-text setting: the lab template's configChanges omit fontWeightAdjustment,
  so the Activity is recreated); the job 4 s after the trigger mark, the app in the foreground.

  WHAT THE STEP READS (from the launch) — the values a sound SDK gives:
    * configure@0: exactly one delivery, `react-native-background-fetch`; driverEvents `fetch=1`.
    * fetchReceived 1, fetchFinished 1, jobFinished 1, stoppingOnTerminate 0, jobsCancelled `-`; jobIds 999 at the end.
    * headless false: the last probe after the recreation (the new Activity's ticks) reads LifecycleManager's flag.
    * lifecycleTally: recorded — the SDK's `☯️` lines, so a green reads "ProcessLifecycleOwner reset it this time"
      (an `onStart` after the trigger) and a red "the flag stuck" (`headless:true`, no `onStart`).
  A red here gets its own work order (WO-002: each confirmed suspected defect).  It did: WO-003 (MEASURED red
  2026-11-09, Lab1).

  (WO-003) The step `stop-on-terminate-false` is the same recreation with stopOnTerminate false and enableHeadless true:
  the branch where doFetch hands the fetch to the headless path (BackgroundFetch.java:272-285) and React Native's
  HeadlessTask returns at once because the app is RESUMED (HeadlessTask.java:67-70).  A sound plugin delivers it to the
  driver as in `run`; the defect strands it (PREDICTED before the fix: no driver event, no finish, no headless JS task).

  (WO-002, 2026-11-12) Capacitor is listed, PREDICTED GREEN on both steps: its plugin has no onDestroy hook
  (BackgroundFetchPlugin.java), so the flag stays false through the recreation.  Two readings differ there, each
  pinned per platform (platform_expect, both steps):
    * The taskId is the bridge's own: configure@0 takes any bridge's fetch taskId, and driverTally pins each
      platform's.
    * A recreation reloads Capacitor's page, whose driver re-arms configure@0 and so configures again: the SDK's
      `Re-configured existing task` branch reschedules job 999 (BackgroundFetch.java:88-95; BGTask.reschedule
      cancels, then schedules, BGTask.java:123-131), so jobsCancelled reads 999 there.  stoppingOnTerminate 0,
      jobIds 999 and the driver's delivery still tell the defect apart.  The job at +4 s must come over 1 s after
      that reschedule (FetchJobService.java:24-31): a cold page boot reached configure() 0.3 s after its process
      started (termination-calibration's kill, MEASURED); a recreation's reload is NOT CHECKED.
platforms: [react-native, capacitor]
not_applicable:
  ios: "2026-11-09 — iOS has no headless mode; `job:` and the bold trigger's recreation are Android's."
measure_from: launch
# (WO-002, 2026-11-12) Both steps (description): each platform's own fetch taskId, and Capacitor's reschedule.
platform_expect:
  react-native: {driverTally: "fetch:react-native-background-fetch=1"}
  capacitor: {driverTally: "fetch:capacitor-background-fetch=1", jobsCancelled: "999"}
steps:
  - name: run
    settle: 10
    after: 30
    trigger: bold
    events:
      - subscribe: configure
        args: {minimumFetchInterval: 15, stopOnTerminate: true, enableHeadless: false, startOnBoot: false}
        min: 1
        max: 1
        # (WO-002, 2026-11-12) Any bridge's fetch taskId: driverTally pins each platform's own (platform_expect).
        returns: {$: {type: string, in: [react-native-background-fetch, capacitor-background-fetch,
                                         cordova-background-fetch, flutter_background_fetch]}}
    actions:
      - {after: {point: trigger}, delay_s: 4, job: 999}
    expect:
      crashes: 0
      driverEvents: "fetch=1"
      fetchReceived: 1
      fetchFinished: 1
      jobFinished: 1
      stoppingOnTerminate: 0
      jobsCancelled: "-"
      headless: false
      jobIds: "999"
      lifecycleTally: any
      bootBroadcasts: any
  # (WO-003) The stopOnTerminate false branch of the same defect.
  - name: stop-on-terminate-false
    settle: 10
    after: 30
    trigger: bold
    events:
      - subscribe: configure
        args: {minimumFetchInterval: 15, stopOnTerminate: false, enableHeadless: true, startOnBoot: false}
        min: 1
        max: 1
        # (WO-002, 2026-11-12) Any bridge's fetch taskId: driverTally pins each platform's own (platform_expect).
        returns: {$: {type: string, in: [react-native-background-fetch, capacitor-background-fetch,
                                         cordova-background-fetch, flutter_background_fetch]}}
    actions:
      - {after: {point: trigger}, delay_s: 4, job: 999}
    expect:
      crashes: 0
      driverEvents: "fetch=1"
      fetchReceived: 1
      fetchFinished: 1
      jobFinished: 1
      headlessEvents.fetch: 0
      rnHeadlessStarts: 0
      rnHeadlessErrors: 0
      stoppingOnTerminate: 0
      fetchTimeouts: 0
      jobsCancelled: "-"
      headless: false
      jobIds: "999"
      lifecycleTally: any
      bootBroadcasts: any
