id: BackgroundFetch.configure
kind: method
description: |-
  Configure the plugin and begin listening for background-fetch events.

  Calling `configure` automatically starts background-fetch (equivalent to calling
  [[BackgroundFetch.start]] immediately after configuration).

  The [[BackgroundFetchConfig.minimumFetchInterval]] option controls how frequently
  iOS will wake your app in the background.  Android uses `JobScheduler` (or
  `AlarmManager` when [[AbstractConfig.forceAlarmManager]] is `true`) and supports
  additional scheduling constraints such as [[AbstractConfig.requiredNetworkType]],
  [[AbstractConfig.requiresCharging]], etc.

  !!! warning
      You **must** call [[BackgroundFetch.finish]] within your event callback.  Failure to
      do so will result in the OS throttling future background events for your app.

  @example example-basic
  @example example-android
examples:
  example-basic:
    title: Basic configuration
    code:
      ts: |-
        const status = await BackgroundFetch.configure({
          minimumFetchInterval: 15,     // <-- iOS: minimum interval in minutes
        }, async (taskId) => {
          console.log('[BackgroundFetch] taskId:', taskId);
          // You MUST call finish() when your work is complete.
          BackgroundFetch.finish(taskId);
        }, (taskId) => {
          // The OS is about to kill your app — stop all work immediately.
          console.log('[BackgroundFetch] TIMEOUT, taskId:', taskId);
          BackgroundFetch.finish(taskId);
        });

        console.log('[BackgroundFetch] status:', status);
      dart: |-
        int status = await BackgroundFetch.configure(BackgroundFetchConfig(
          minimumFetchInterval: 15,
        ), (String taskId) async {
          print('[BackgroundFetch] taskId: $taskId');
          BackgroundFetch.finish(taskId);
        }, (String taskId) {
          print('[BackgroundFetch] TIMEOUT: $taskId');
          BackgroundFetch.finish(taskId);
        });

        print('[BackgroundFetch] status: $status');
      swift: |-
        let status = await BackgroundFetch.shared.configure(minimumFetchInterval: 15 * 60)  // seconds

        BackgroundFetch.shared.onFetch(identifier: "MyApp") { event in
            if event.timeout {
                // The OS is about to suspend the app — finish immediately.
                print("[BackgroundFetch] TIMEOUT: \(event.taskId)")
                BackgroundFetch.shared.finish(taskId: event.taskId)
                return
            }
            print("[BackgroundFetch] Event received: \(event.taskId)")
            // Perform your work here...
            BackgroundFetch.shared.finish(taskId: event.taskId)
        }

        print("[BackgroundFetch] status: \(status)")
      kotlin: |-
        val config = BackgroundFetchConfig.Builder()
            .setMinimumFetchInterval(15)   // minutes
            .build()

        BackgroundFetch.getInstance(context).configure(config, object : BackgroundFetch.Callback {
            override fun onFetch(taskId: String) {
                Log.d(TAG, "[BackgroundFetch] Event received: $taskId")
                // Perform your work here...
                BackgroundFetch.getInstance(context).finish(taskId)
            }
            override fun onTimeout(taskId: String) {
                Log.d(TAG, "[BackgroundFetch] TIMEOUT: $taskId")
                BackgroundFetch.getInstance(context).finish(taskId)
            }
        })
  example-android:
    title: Android configuration
    code:
      ts: |-
        BackgroundFetch.configure({
          minimumFetchInterval: 15,
          stopOnTerminate: false,     // <-- Continue after app termination
          startOnBoot: true,          // <-- Restart on device reboot
          enableHeadless: true,       // <-- Enable headless task for terminated app
          requiresCharging: false,
          requiresBatteryNotLow: true,
        }, async (taskId) => {
          console.log('[BackgroundFetch] taskId:', taskId);
          BackgroundFetch.finish(taskId);
        }, (taskId) => {
          BackgroundFetch.finish(taskId);
        });
      dart: |-
        BackgroundFetch.configure(BackgroundFetchConfig(
          minimumFetchInterval: 15,
          stopOnTerminate: false,
          startOnBoot: true,
          enableHeadless: true,
          requiresBatteryNotLow: true,
        ), (String taskId) async {
          print('[BackgroundFetch] taskId: $taskId');
          BackgroundFetch.finish(taskId);
        }, (String taskId) {
          BackgroundFetch.finish(taskId);
        });
signatures:
  ts: "static configure(config: BackgroundFetchConfig, onEvent: (taskId: string) => void, onTimeout?: (taskId: string) => void): Promise<BackgroundFetchStatus>;"
  dart: "static Future<int> configure(BackgroundFetchConfig config, Function(String) onFetch, [Function(String)? onTimeout])"
  swift: "func configure(minimumFetchInterval: TimeInterval = 0) async -> UIBackgroundRefreshStatus"
  kotlin: "fun configure(config: BackgroundFetchConfig, callback: BackgroundFetch.Callback)"
