id: BackgroundFetch.start
kind: method
description: |-
  Start subscribing to background-fetch events.

  [[BackgroundFetch.configure]] calls `start` automatically.  Use `start` explicitly
  only after a previous call to [[BackgroundFetch.stop]].

  @example example-1
examples:
  example-1:
    title: Example
    code:
      ts: |-
        const status = await BackgroundFetch.start();
        console.log('[BackgroundFetch] started, status:', status);
      dart: |-
        int status = await BackgroundFetch.start();
        print('[BackgroundFetch] started, status: $status');
      swift: |-
        // Resume after a previous stop().
        try BackgroundFetch.shared.start()
      kotlin: |-
        // Resume after a previous stop().
        BackgroundFetch.getInstance(context).start("com.transistorsoft.fetch")
signatures:
  ts: "static start(): Promise<BackgroundFetchStatus>;"
  dart: "static Future<int> start()"
  swift: "func start(identifier: String? = nil) throws"
  kotlin: "fun start(taskId: String)"
